# .github/workflows/pages.yml
# CI on every pull request; on every push to main, also build the app and publish it
# to GitHub Pages at https://realjewo12.github.io/MedAssist/
name: CI and GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # "Run workflow" button in the Actions tab

permissions:
  contents: read

# one Pages deployment at a time; a newer push replaces a waiting one
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24 # Nuxt 4.6 needs Node ^22.22.3, ^24.15 or >=26
          cache: npm
      - run: npm ci
      - run: npx prettier --check .
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  build:
    name: Build for GitHub Pages
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Generate the static site under /MedAssist/
        run: npm run generate
        env:
          NUXT_APP_BASE_URL: /${{ github.event.repository.name }}/ # project site lives in a sub-path
          NITRO_PRESET: github_pages # adds .nojekyll and a 404.html fallback
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    name: Publish to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
