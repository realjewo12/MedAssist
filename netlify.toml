# netlify.toml — Sprint 3: phone test through a Netlify draft link
# The app is a static single-page app (ssr: false). On Netlify, Nuxt detects the platform
# and uses its "netlify-static" preset, which writes the site to dist/ (on your own
# computer, `npm run generate` still writes to .output/public).
[build]
  command = "npm run generate"
  publish = "dist"

[build.environment]
  # Nuxt 4.6 needs Node ^22.22.3, ^24.15 or >=26: use the current long-term-support line
  NODE_VERSION = "24"

# Any unknown path (e.g. a reload on /emergency/severity) loads the app shell;
# real files are still served first because this rule is not forced.
[[redirects]]
  from = "/*"
  to = "/200.html"
  status = 200

# Basic security headers, and no search-engine indexing: this is demo medical content
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    X-Robots-Tag = "noindex, nofollow"
